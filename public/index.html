<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f3b46">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Caisse boissons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eff0; --surface:#ffffff; --ink:#10282e; --muted:#5b747a; --line:#d3dfe1;
  --petrol:#0f3b46; --petrol-ink:#ffffff; --accent:#ff5d4d; --accent-ink:#ffffff;
  --ok:#14804a; --ok-bg:#dff3e8; --warn:#b4570a;
  --cat-chaud:#f4d9c6; --cat-frais:#d4ecf5; --cat-bieres:#f7e6a8; --cat-vins:#ecd0dc; --cat-cocktails:#d9e8c4; --cat-lav:#e1dcf2; --cat-gris:#e0e4e5; --cat-corail:#fadbd5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1d22; --surface:#13303a; --ink:#e8f1f3; --muted:#93b0b7; --line:#24474f;
    --petrol:#0a2a32; --accent:#ff6f61; --ok:#58d79a; --ok-bg:#133b2a; --warn:#f0a35a;
    --cat-chaud:#4a3426; --cat-frais:#1d4352; --cat-bieres:#4d4420; --cat-vins:#4a2b3a; --cat-cocktails:#33472a; --cat-lav:#3a3552; --cat-gris:#2c3f45; --cat-corail:#52302c;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1d22; --surface:#13303a; --ink:#e8f1f3; --muted:#93b0b7; --line:#24474f;
  --petrol:#0a2a32; --accent:#ff6f61; --ok:#58d79a; --ok-bg:#133b2a; --warn:#f0a35a;
  --cat-chaud:#4a3426; --cat-frais:#1d4352; --cat-bieres:#4d4420; --cat-vins:#4a2b3a; --cat-cocktails:#33472a; --cat-lav:#3a3552; --cat-gris:#2c3f45; --cat-corail:#52302c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:18px;user-select:none;-webkit-user-select:none;overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,.display{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif}

.app{display:grid;grid-template-columns:1fr 390px;grid-template-rows:auto 1fr;height:100%;gap:0}
header{
  grid-column:1/-1;display:flex;align-items:center;gap:16px;
  background:var(--petrol);color:var(--petrol-ink);padding:12px 20px;
}
header h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
header .spacer{flex:1}
header .meta{opacity:.8;font-size:15px}
.hbtn{
  min-height:48px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.12);
  color:var(--petrol-ink);font-weight:500;font-size:16px;
}
.hbtn:active{background:rgba(255,255,255,.25)}

/* Menu */
.menu{display:flex;flex-direction:column;min-height:0;padding:16px 16px 16px 20px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;min-height:56px;padding:0 22px;border-radius:28px;
  background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:18px;
  display:flex;align-items:center;gap:8px;
}
.tab[aria-selected="true"]{background:var(--petrol);color:var(--petrol-ink);border-color:var(--petrol)}
.grid{
  flex:1;overflow-y:auto;display:grid;gap:14px;align-content:start;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));padding:2px 4px 8px 2px;
}
.drink{
  position:relative;min-height:138px;border-radius:20px;padding:14px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;
  background:var(--tint);border:2px solid transparent;
  transition:transform .08s ease;
}
.drink:active{transform:scale(.96)}
.drink .ico{font-size:38px;line-height:1}
.drink .name{font-weight:700;font-size:19px;line-height:1.15;color:var(--ink)}
.drink .price{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;color:var(--ink)}
.drink .badge{
  position:absolute;top:10px;right:10px;min-width:34px;height:34px;padding:0 9px;border-radius:17px;
  background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;
  display:none;align-items:center;justify-content:center;
}
.drink.has .badge{display:flex}
.drink.has{border-color:var(--accent)}

/* Panier */
.cart{
  background:var(--surface);border-left:2px solid var(--line);display:flex;flex-direction:column;min-height:0;
}
.cart-head{display:flex;align-items:center;padding:16px 20px 8px}
.cart-head h2{margin:0;font-size:22px;flex:1}
.clear{min-height:44px;padding:0 14px;border-radius:10px;color:var(--muted);font-weight:500;font-size:16px;border:2px solid var(--line)}
.clear[disabled]{opacity:.4}
.lines{flex:1;overflow-y:auto;padding:4px 20px}
.empty{color:var(--muted);text-align:center;margin-top:48px;line-height:1.4;padding:0 12px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .l-name{font-weight:700}
.line .l-sum{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;text-align:right}
.qty{display:flex;align-items:center;gap:6px;grid-column:1/-1;margin-top:4px}
.qty button{
  width:48px;height:48px;border-radius:14px;background:var(--bg);font-size:26px;font-weight:700;line-height:1;
}
.qty button:active{background:var(--line)}
.qty span{min-width:36px;text-align:center;font-weight:800;font-size:20px}
.qty .unit{margin-left:auto;color:var(--muted);font-size:15px}
.totals{padding:14px 20px 18px;border-top:2px solid var(--line)}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.total-row .lbl{color:var(--muted);font-weight:500}
.total-row .amt{font-family:"Bricolage Grotesque",sans-serif;font-size:42px;font-weight:800;letter-spacing:-.02em}
.pay{
  width:100%;min-height:72px;border-radius:20px;background:var(--accent);color:var(--accent-ink);
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;
}
.pay:active{filter:brightness(.92)}
.pay[disabled]{background:var(--line);color:var(--muted)}

/* Modale paiement */
.overlay{
  position:fixed;inset:0;background:rgba(6,20,24,.62);display:none;align-items:center;justify-content:center;padding:20px;z-index:10;
}
.overlay.open{display:flex}
.sheet{
  background:var(--surface);border-radius:28px;width:min(760px,100%);max-height:100%;overflow:auto;padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.sheet h2{margin:0 0 4px;font-size:30px}
.sheet .sub{color:var(--muted);margin:0 0 20px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.method{
  min-height:150px;border-radius:22px;border:2px solid var(--line);background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:26px;
}
.method .ico{font-size:48px}
.method:active{border-color:var(--accent)}
.ghost{min-height:56px;padding:0 24px;border-radius:16px;border:2px solid var(--line);font-weight:700}
.row{display:flex;gap:12px;align-items:center}
.row .grow{flex:1}

.cash{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.figures .fig{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.figures .fig b{font-family:"Bricolage Grotesque",sans-serif;font-size:26px}
.figures .change b{color:var(--ok)}
.figures .missing b{color:var(--warn)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.quick button,.keys button{
  min-height:64px;border-radius:16px;background:var(--bg);font-weight:700;font-size:22px;border:2px solid var(--line);
}
.quick button:active,.keys button:active{background:var(--line)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.center{text-align:center;padding:12px 0}
.pulse{
  width:120px;height:120px;border-radius:60px;background:var(--bg);margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;font-size:56px;position:relative;
}
.pulse::after{
  content:"";position:absolute;inset:0;border-radius:inherit;border:4px solid var(--accent);
  animation:ring 1.4s ease-out infinite;
}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.check{
  width:120px;height:120px;border-radius:60px;background:var(--ok-bg);color:var(--ok);
  margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800;
}
.done-amount{font-family:"Bricolage Grotesque",sans-serif;font-size:48px;font-weight:800}
.big-change{background:var(--ok-bg);color:var(--ok);border-radius:20px;padding:16px;margin:16px auto 0;max-width:420px;font-weight:700}
.big-change b{font-family:"Bricolage Grotesque",sans-serif;font-size:40px;display:block}
.primary{min-height:72px;padding:0 36px;border-radius:20px;background:var(--petrol);color:var(--petrol-ink);font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;margin-top:24px}
:root[data-theme="dark"] .primary,
:root:not([data-theme="light"]) .primary{--x:0}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .primary{background:var(--accent);color:#fff} }
:root[data-theme="dark"] .primary{background:var(--accent);color:#fff}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 20px;border-radius:14px;font-weight:500;display:none;z-index:20;
}
.toast.show{display:block}

a.method,a.ghost{text-decoration:none;color:inherit}
a.ghost{display:inline-flex;align-items:center}
a.method{border-color:var(--accent)}
.method small{font-family:"DM Sans",sans-serif;font-size:14px;font-weight:500;color:var(--muted)}
.form{display:grid;gap:14px;margin-bottom:16px}
.field{display:grid;gap:6px;font-weight:700}
.field input{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 16px;font:inherit;font-weight:400;user-select:text;-webkit-user-select:text}
.hint{color:var(--muted);font-size:15px;line-height:1.45;margin:0 0 20px}
.check.bad{background:var(--bg);color:var(--accent)}
.detail{color:var(--muted);font-size:14px}
.steps{margin:0 0 16px;padding-left:24px;line-height:1.5}
.steps li{margin-bottom:6px}
.field select{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit}
.check{display:flex;align-items:center;gap:12px;font-weight:700;min-height:48px}
.check input{width:28px;height:28px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow.off{opacity:.6}
.crow .cico{font-size:28px;width:40px;text-align:center}
.crow .cname{display:flex;flex-direction:column;min-width:0;flex:1 1 140px}
.crow .cname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cname small{color:var(--muted);font-size:15px}
.chip{min-height:48px;padding:0 14px;border-radius:12px;border:2px solid var(--line);font-weight:700;font-size:15px}
.chip.on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.sq{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:22px}
.sq[disabled]{opacity:.35}
.sq.sel{border-color:var(--accent)}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:48px;height:48px;border-radius:24px;border:3px solid var(--line)}
.swatch.sel{border-color:var(--ink)}
.trow{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);min-height:56px;font-size:16px}
.trow:last-child{border-bottom:0}
.trow .box{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800}
.trow.on .box{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.gap-ok b{color:var(--ok)}
.gap-bad b{color:var(--warn)}
.ptcol h3{margin:0 0 6px;font-size:20px}
.ghost[disabled]{opacity:.4}
.danger{color:var(--accent);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 12px}
.stat{background:var(--bg);border-radius:16px;padding:14px}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:28px}
.stat span{color:var(--muted);font-size:15px}
.olist{max-height:200px;overflow:auto;border:2px solid var(--line);border-radius:14px;margin-bottom:16px}
.orow{display:grid;grid-template-columns:72px 140px 1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:16px}
.orow:last-child{border-bottom:0}
.orow .t{font-weight:700;font-family:"Bricolage Grotesque",sans-serif}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pinpad{max-width:360px;margin:0 auto}
.dots{display:flex;gap:14px;justify-content:center;margin:12px 0 8px;min-height:24px}
.dots i{width:20px;height:20px;border-radius:10px;background:var(--line)}
.dots i.on{background:var(--ink)}
.err{color:var(--accent);font-weight:700;min-height:28px;text-align:center}
/* Portrait / petits écrans */
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr 46vh}
  .cart{border-left:0;border-top:2px solid var(--line)}
  .menu{padding:12px}
  .cash{grid-template-columns:1fr}
  header .meta{display:none}
}
@media (prefers-reduced-motion:reduce){.pulse::after{animation:none}.drink{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Caisse boissons</h1>
    <span class="meta" id="orderMeta"></span>
    <span class="meta" id="soloMeta"></span>
    <span class="spacer"></span>
    <button class="hbtn" id="btnAdmin">Admin</button>
    <button class="hbtn" id="btnSettings">Réglages</button>
    <button class="hbtn" id="btnTheme" aria-label="Changer le thème">Thème</button>
    <button class="hbtn" id="btnFs">Plein écran</button>
  </header>

  <main class="menu">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </main>

  <aside class="cart" aria-label="Commande en cours">
    <div class="cart-head">
      <h2>Commande</h2>
      <button class="clear" id="btnClear">Vider</button>
    </div>
    <div class="lines" id="lines"></div>
    <div class="totals">
      <div class="total-row"><span class="lbl" id="count">0 article</span><span class="amt" id="total">0,00 €</span></div>
      <button class="pay" id="btnPay">Payer</button>
    </div>
  </aside>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  /* ---------- Données : modifiez ici votre carte ---------- */
  var CATEGORIES = [
    {id:"chaud", label:"Boissons chaudes", ico:"☕", tint:"var(--cat-chaud)"},
    {id:"frais", label:"Softs & eaux", ico:"🥤", tint:"var(--cat-frais)"},
    {id:"bieres", label:"Bières", ico:"🍺", tint:"var(--cat-bieres)"},
    {id:"vins", label:"Vins", ico:"🍷", tint:"var(--cat-vins)"},
    {id:"cocktails", label:"Cocktails", ico:"🍹", tint:"var(--cat-cocktails)"}
  ];
  var DRINKS = [
    {id:"cafe", cat:"chaud", name:"Café", ico:"☕", price:200},
    {id:"allonge", cat:"chaud", name:"Café allongé", ico:"☕", price:220},
    {id:"creme", cat:"chaud", name:"Café crème", ico:"🥛", price:350},
    {id:"cappu", cat:"chaud", name:"Cappuccino", ico:"☕", price:420},
    {id:"the", cat:"chaud", name:"Thé", ico:"🫖", price:350},
    {id:"choco", cat:"chaud", name:"Chocolat chaud", ico:"🍫", price:400},

    {id:"eau", cat:"frais", name:"Eau plate 50 cl", ico:"💧", price:200},
    {id:"gazeuse", cat:"frais", name:"Eau gazeuse 50 cl", ico:"🫧", price:250},
    {id:"cola", cat:"frais", name:"Cola", ico:"🥤", price:350},
    {id:"orange", cat:"frais", name:"Jus d'orange", ico:"🍊", price:400},
    {id:"limo", cat:"frais", name:"Limonade", ico:"🍋", price:350},
    {id:"icetea", cat:"frais", name:"Thé glacé", ico:"🧊", price:350},

    {id:"blonde", cat:"bieres", name:"Blonde 25 cl", ico:"🍺", price:300},
    {id:"blonde50", cat:"bieres", name:"Blonde 50 cl", ico:"🍺", price:550},
    {id:"blanche", cat:"bieres", name:"Blanche 25 cl", ico:"🍻", price:350},
    {id:"ipa", cat:"bieres", name:"IPA 33 cl", ico:"🍺", price:500},
    {id:"sans", cat:"bieres", name:"Sans alcool", ico:"🍺", price:350},

    {id:"rouge", cat:"vins", name:"Vin rouge", ico:"🍷", price:400},
    {id:"blanc", cat:"vins", name:"Vin blanc", ico:"🥂", price:400},
    {id:"rose", cat:"vins", name:"Rosé", ico:"🍷", price:400},
    {id:"cremant", cat:"vins", name:"Crémant", ico:"🍾", price:600},

    {id:"spritz", cat:"cocktails", name:"Spritz", ico:"🍹", price:850},
    {id:"mojito", cat:"cocktails", name:"Mojito", ico:"🌿", price:900},
    {id:"gintonic", cat:"cocktails", name:"Gin tonic", ico:"🍸", price:900},
    {id:"virgin", cat:"cocktails", name:"Cocktail sans alcool", ico:"🍹", price:650}
  ];

  /* ---------- État ---------- */
  var cart = {};            // id -> quantité
  var currentCat = CATEGORIES[0].id;
  var orderNo = 1;
  var pay = null;           // état de la modale de paiement
  var timer = null;
  /* ---------- Réglages (nom de la caisse) ---------- */
  var CFG_KEY = "caisse-cfg";
  function loadCfg(){
    var d = {device:"Caisse 1", token:""};
    ["caisse-cfg","caisse-sumup-cfg"].some(function(k){
      try { var o = JSON.parse(localStorage.getItem(k)||"null"); if(o && (o.device || o.token)){ if(o.device) d.device = o.device; if(o.token) d.token = o.token; return true; } } catch(e){}
      return false;
    });
    return d;
  }
  var cfg = loadCfg();
  function saveCfg(){ try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch(e){} }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
  function viewSettings(){
    openSheet(
      `<h2>Réglages</h2><p class="sub">Ces réglages sont propres à cette tablette.</p>`+
      `<div class="form">`+
      `<label class="field"><span>Nom de cette caisse (visible dans l'historique)</span><input id="cfgDev" value="${esc(cfg.device)}" placeholder="ex. Bar, Terrasse" autocomplete="off" spellcheck="false"></label>`+
      `<label class="field"><span>Code d'accès de la caisse (variable CAISSE_TOKEN)</span><input id="cfgTok" type="password" value="${esc(cfg.token)}" placeholder="Le code défini dans Netlify" autocomplete="off" autocapitalize="off" spellcheck="false"></label>`+
      `</div>`+
      `<div class="figures"><h3 style="margin:0 0 8px;font-size:20px">Terminal SumUp Solo</h3>`+
      `<div class="row" style="margin-bottom:12px"><button class="ghost" data-solotest>Tester la connexion</button></div>`+
      `<label class="field"><span>Appairer un Solo (code affiché sur le terminal)</span><input id="cfgPair" placeholder="8 ou 9 caractères" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>`+
      `<div class="row" style="margin:10px 0"><button class="ghost" data-solopair>Appairer</button></div>`+
      `<p class="detail" id="soloMsg" role="status"></p></div>`+
      `<div class="row" style="margin-top:12px"><button class="ghost" data-close>Fermer</button><span class="grow"></span><button class="primary" style="margin-top:0" data-save>Enregistrer</button></div>`
    );
  }

  try { var n = parseInt(localStorage.getItem("caisse-order-no"),10); if(n>0) orderNo = n; } catch(e){}

  var $ = function(id){ return document.getElementById(id); };
  var byId = {}; DRINKS.forEach(function(d){ byId[d.id]=d; });

  /* ---------- Catalogue (modifiable depuis l'admin) ---------- */
  var CAT_KEY = "caisse-catalogue";
  var TINTS = ["chaud","frais","bieres","vins","cocktails","lav","gris","corail"];
  var DEFAULT_CAT = JSON.parse(JSON.stringify({categories:CATEGORIES, drinks:DRINKS}));
  var catTs = 0, catUnsub = null, catSubscribing = false;
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function sanitizeCatalogue(c){
    if(!c || !Array.isArray(c.categories) || !Array.isArray(c.drinks)) return null;
    var okTint = TINTS.map(function(k){ return "var(--cat-"+k+")"; });
    var cats = [], ids = {};
    c.categories.forEach(function(x){
      if(!x || !x.id || !String(x.label||"").trim() || ids[x.id]) return;
      ids[x.id] = true;
      cats.push({id:String(x.id), label:String(x.label).slice(0,40), ico:String(x.ico||"").slice(0,8), tint: okTint.indexOf(x.tint)>=0 ? x.tint : okTint[6]});
    });
    var seen = {}, drinks = [];
    c.drinks.forEach(function(d){
      if(!d || !d.id || !ids[d.cat] || seen[d.id] || !String(d.name||"").trim()) return;
      var pr = Math.round(Number(d.price)); if(!isFinite(pr) || pr < 0) return;
      seen[d.id] = true;
      drinks.push({id:String(d.id), cat:d.cat, name:String(d.name).slice(0,60), ico:String(d.ico||"🥤").slice(0,8), price:pr, active:d.active!==false});
    });
    if(!cats.length) return null;
    return {categories:cats, drinks:drinks, ts:Number(c.ts)||0, device:String(c.device||"")};
  }
  function visibleCats(){ return CATEGORIES.filter(function(c){ return DRINKS.some(function(d){ return d.cat===c.id && d.active!==false; }); }); }
  function applyCatalogue(c){
    var old = byId;
    CATEGORIES = c.categories; DRINKS = c.drinks; catTs = c.ts || 0;
    byId = {}; DRINKS.forEach(function(d){ byId[d.id] = d; });
    Object.keys(cart).forEach(function(id){ if(!byId[id] && old[id]) byId[id] = old[id]; });   // une commande en cours reste vendable
    var vis = visibleCats();
    if(!vis.some(function(x){ return x.id===currentCat; })) currentCat = vis.length ? vis[0].id : (CATEGORIES[0] ? CATEGORIES[0].id : "");
    renderTabs(); renderCart();
  }
  function loadCatalogueLocal(){
    try { var c = sanitizeCatalogue(JSON.parse(localStorage.getItem(CAT_KEY)||"null")); if(c) applyCatalogue(c); } catch(e){}
  }
  function subscribeCatalogue(){
    if(catUnsub || catSubscribing) return;
    catSubscribing = true;
    getDb().then(function(db){
      catSubscribing = false;
      if(!db) return;
      try {
        var ref = db.doc("catalogue/main");
        catUnsub = ref.onSnapshot(function(snap){
          var c = snap.exists ? sanitizeCatalogue(clone(snap.data())) : null;
          if(c && c.ts > catTs){
            try { localStorage.setItem(CAT_KEY, JSON.stringify(c)); } catch(e){}
            applyCatalogue(c);
          } else if(catTs > 0 && (!c || c.ts < catTs)){
            // la version de cette tablette est plus récente que la base : on la renvoie
            ref.set({categories:CATEGORIES, drinks:DRINKS, ts:catTs, device:cfg.device}).catch(function(){});
          }
        }, function(){ catUnsub = null; });
      } catch(e){ catUnsub = null; }
    }).catch(function(){ catSubscribing = false; });
  }
  var fmt = function(c){ return (c/100).toLocaleString("fr-FR",{style:"currency",currency:"EUR"}); };

  function totalCents(){ var t=0; for(var k in cart) if(byId[k]) t+=cart[k]*byId[k].price; return t; }
  function itemCount(){ var t=0; for(var k in cart) t+=cart[k]; return t; }

  /* ---------- Menu ---------- */
  function renderTabs(){
    $("tabs").innerHTML = visibleCats().map(function(c){
      return '<button class="tab" role="tab" data-cat="'+esc(c.id)+'" aria-selected="'+(c.id===currentCat)+'"><span aria-hidden="true">'+esc(c.ico)+'</span>'+esc(c.label)+'</button>';
    }).join("");
  }
  function renderGrid(){
    var cat = CATEGORIES.filter(function(c){return c.id===currentCat;})[0];
    var list = cat ? DRINKS.filter(function(d){ return d.cat===currentCat && d.active!==false; }) : [];
    $("grid").innerHTML = list.length ? list.map(function(d){
      var q = cart[d.id]||0;
      return '<button class="drink'+(q?' has':'')+'" data-add="'+esc(d.id)+'" style="--tint:'+cat.tint+'">'+
        '<span class="badge">'+q+'</span><span class="ico" aria-hidden="true">'+esc(d.ico)+'</span>'+
        '<span><span class="name">'+esc(d.name)+'</span><br><span class="price">'+fmt(d.price)+'</span></span></button>';
    }).join("") : '<div class="empty" style="grid-column:1/-1">Aucune boisson au catalogue.<br>Ajoutez-en dans Admin › Catalogue des boissons.</div>';
  }

  /* ---------- Panier ---------- */
  function renderCart(){
    var ids = Object.keys(cart);
    $("lines").innerHTML = ids.length ? ids.map(function(id){
      var d = byId[id], q = cart[id];
      return '<div class="line"><span class="l-name">'+esc(d.name)+'</span><span class="l-sum">'+fmt(d.price*q)+'</span>'+
        '<div class="qty"><button data-dec="'+esc(id)+'" aria-label="Retirer un '+esc(d.name)+'">−</button><span>'+q+'</span>'+
        '<button data-inc="'+esc(id)+'" aria-label="Ajouter un '+esc(d.name)+'">+</button><span class="unit">'+fmt(d.price)+' l\'unité</span></div></div>';
    }).join("") : '<div class="empty">Aucune boisson sélectionnée.<br>Touchez une boisson pour l\'ajouter.</div>';
    var n = itemCount();
    $("count").textContent = n+" article"+(n>1?"s":"");
    $("total").textContent = fmt(totalCents());
    $("btnPay").disabled = n===0;
    $("btnPay").textContent = n ? "Payer "+fmt(totalCents()) : "Payer";
    $("btnClear").disabled = n===0;
    $("orderMeta").textContent = "Commande n° "+orderNo;
    renderGrid();
  }
  function add(id,delta){
    cart[id] = (cart[id]||0)+delta;
    if(cart[id]<=0) delete cart[id];
    renderCart();
  }

  /* ---------- Paiement ---------- */
  function openSheet(html){ $("sheet").innerHTML = html; $("overlay").classList.add("open"); }
  function closeSheet(){ $("overlay").classList.remove("open"); clearTimeout(timer); pay=null; adm=null; }

  function viewMethods(){
    pay = {};
    var t = totalCents();
    openSheet(
      '<h2>Comment réglez-vous ?</h2><p class="sub">Commande n° '+orderNo+' · '+itemCount()+' article(s) · <b>'+fmt(t)+'</b></p>'+
      '<div class="methods">'+
        '<button class="method" data-method="card"><span class="ico" aria-hidden="true">💳</span>Carte (SumUp Solo)</button>'+
        '<button class="method" data-method="cash"><span class="ico" aria-hidden="true">💶</span>Espèces</button>'+
      '</div><button class="ghost" data-close>Retour à la commande</button>'
    );
  }
  /* ---------- Paiement par carte : terminal SumUp Solo (API Cloud, via la fonction Netlify) ---------- */
  var SOLO_KEY = "caisse-solo-pending", METHOD_CARD = "Carte (SumUp Solo)";
  var solo = {timer:null, fails:0, cancelling:false, confirming:false, busy:false};
  async function api(action, data){
    var res;
    try {
      res = await fetch("/.netlify/functions/sumup", {
        method:"POST",
        headers:{"Content-Type":"application/json", "x-caisse-token":cfg.token || ""},
        body:JSON.stringify(Object.assign({action:action}, data || {}))
      });
    } catch(e){ var ne = new Error("Pas de connexion internet."); ne.code = "network"; throw ne; }
    var j = null; try { j = await res.json(); } catch(e){}
    if(!res.ok){ var er = new Error((j && j.error) || ("Erreur "+res.status)); er.status = res.status; er.code = (j && j.code) || "http"; throw er; }
    return j;
  }
  function apiMessage(e){
    if(e && e.code === "bad_token") return "Code d'accès refusé : saisissez-le dans Réglages.";
    if(e && e.code === "network") return "Pas de connexion internet : le montant n'a pas pu être envoyé.";
    return (e && e.message) || "Erreur inconnue.";
  }
  function readSolo(){ try { return JSON.parse(localStorage.getItem(SOLO_KEY)||"null"); } catch(e){ return null; } }
  function writeSolo(p){ try { if(p) localStorage.setItem(SOLO_KEY, JSON.stringify(p)); else localStorage.removeItem(SOLO_KEY); } catch(e){} }

  async function startSolo(){
    if(solo.busy || !itemCount()) return;
    if(!cfg.token){ viewSoloError("Code d'accès non renseigné : ouvrez Réglages et saisissez le code défini dans Netlify."); return; }
    var t = totalCents();
    solo.busy = true; solo.fails = 0; solo.cancelling = false; solo.confirming = false;
    viewSoloWait({total:t, ts:Date.now(), sending:true});
    try {
      var r = await api("checkout", {amount:t, description:"Commande n° "+orderNo});
      if(!r || !r.checkout_id) throw new Error("Réponse inattendue du serveur : le paiement n'a pas été lancé.");
      var pend = {checkoutId:r.checkout_id, ref:r.client_transaction_id || r.reference || "", cart:cart, orderNo:orderNo, total:t, ts:Date.now()};
      writeSolo(pend);
      viewSoloWait(pend); pollSolo();
    } catch(e){ viewSoloError(apiMessage(e)); }
    finally { solo.busy = false; }
  }
  function viewSoloWait(p){
    openSheet(
      `<div class="center"><div class="pulse" aria-hidden="true">💳</div><h2>${p.sending ? "Envoi au terminal…" : "Présentez la carte sur le Solo"}</h2>`+
      `<div class="done-amount">${fmt(p.total)}</div>`+
      `<p class="sub" id="soloHint">${p.sending ? "Un instant…" : "Le paiement se valide tout seul dès que le terminal confirme."}</p>`+
      `<div id="soloExtra"></div>`+
      (p.sending ? "" : `<div class="row" style="justify-content:center;margin-top:16px"><button class="ghost" data-solocancel>Annuler le paiement</button></div>`)+
      `</div>`
    );
  }
  function viewSoloError(msg){
    openSheet(
      `<div class="center"><div class="check bad" aria-hidden="true">✕</div><h2>Paiement non effectué</h2><p class="sub">${esc(msg)}</p>`+
      `<div class="row" style="justify-content:center;margin-top:20px;flex-wrap:wrap"><button class="ghost" data-soloretry>Réessayer</button><button class="ghost" data-back>Changer de moyen</button><button class="ghost" data-close>Retour à la commande</button></div></div>`
    );
  }
  function pollSolo(){
    clearTimeout(solo.timer);
    solo.timer = setTimeout(async function(){
      var p = readSolo(); if(!p) return;
      try {
        var s = await api("status", {checkout_id:p.checkoutId});
        solo.fails = 0;
        if(!readSolo()) return;                       // déjà réglé ailleurs (autre onglet)
        if(s.status === "successful") return soloSuccess(p);
        if(s.status === "failed" || s.status === "cancelled") return soloFailed(p, s);
      } catch(e){
        if(e.code === "bad_token"){ writeSolo(null); cart = p.cart || cart; renderCart(); return viewSoloError(apiMessage(e)); }
        solo.fails++;
      }
      soloHint(p);
      pollSolo();
    }, 1500);
  }
  function soloHint(p){
    var el = $("soloExtra"); if(!el || solo.confirming) return;
    var html = "";
    if(solo.fails >= 3) html += '<p class="detail">Réponse du serveur difficile à obtenir… nouvel essai en cours.</p>';
    if(Date.now() - p.ts > 45000){
      html += '<p class="detail">Toujours en attente ? Regardez l\'écran du Solo. Si le paiement y est accepté mais que la caisse ne réagit pas, validez-le à la main.</p>'+
        '<div class="row" style="justify-content:center;flex-wrap:wrap"><button class="ghost" data-solomanual>Valider à la main</button><button class="ghost danger" data-soloabandon>Abandonner</button></div>';
    }
    if(el.getAttribute("data-h") !== html){ el.innerHTML = html; el.setAttribute("data-h", html); }
  }
  function soloSuccess(p){
    clearTimeout(solo.timer); writeSolo(null);
    cart = p.cart || {}; orderNo = p.orderNo;
    finish(METHOD_CARD, p.total, 0, p.ref);
  }
  function soloFailed(p, s){
    clearTimeout(solo.timer); writeSolo(null);
    cart = p.cart || cart; orderNo = p.orderNo; renderCart();
    var cancelled = s.status === "cancelled" || solo.cancelling;
    viewSoloError(cancelled ? "Paiement annulé." : "Paiement refusé"+(s.failure_reason ? " ("+s.failure_reason+")" : "")+". Vous pouvez réessayer ou choisir un autre moyen.");
  }
  async function soloCancel(){
    solo.cancelling = true;
    var el = $("soloHint"); if(el) el.textContent = "Annulation demandée au terminal…";
    try { await api("cancel"); }
    catch(e){ solo.cancelling = false; if(el) el.textContent = apiMessage(e); }
  }
  function soloManual(){
    var el = $("soloExtra"); if(!el) return;
    solo.confirming = true;
    el.innerHTML = '<p class="sub"><b>Confirmer :</b> j\'ai vu le paiement accepté sur le Solo.</p>'+
      '<div class="row" style="justify-content:center;flex-wrap:wrap"><button class="ghost" data-soloback>Non, attendre</button><button class="pay" style="width:auto;padding:0 28px;min-height:60px" data-solomanualok>Oui, valider</button></div>';
    el.setAttribute("data-h", "confirm");
  }
  function soloManualOk(){
    var p = readSolo(); if(!p) return;
    clearTimeout(solo.timer); writeSolo(null); solo.confirming = false;
    cart = p.cart || {}; orderNo = p.orderNo;
    finish(METHOD_CARD, p.total, 0, "manuel");
  }
  function soloAbandon(){
    var p = readSolo();
    clearTimeout(solo.timer); writeSolo(null); solo.confirming = false;
    if(p){ cart = p.cart || cart; orderNo = p.orderNo; }
    api("cancel").catch(function(){});
    closeSheet(); renderCart();
    toast("Paiement abandonné : vérifiez le Solo avant de relancer.");
  }
  function resumeSolo(){
    var p = readSolo(); if(!p) return;
    pay = {}; cart = p.cart || {}; orderNo = p.orderNo; renderCart();
    viewSoloWait(p); soloHint(p); pollSolo();
  }
  function refreshSolo(){
    var el = $("soloMeta"); if(!el) return;
    if(!cfg.token){ el.textContent = ""; return; }
    api("reader").then(function(r){
      el.textContent = "Solo : "+(r.online === false ? "hors ligne" : "en ligne")+(r.battery != null ? " · "+r.battery+" %" : "");
    }).catch(function(e){ el.textContent = e.code === "network" ? "Hors connexion" : "Solo : indisponible"; });
  }
  async function soloTest(){
    var msg = $("soloMsg"); cfg.token = ($("cfgTok").value || "").trim(); saveCfg();
    msg.textContent = "Test en cours…";
    try {
      var r = await api("reader");
      msg.textContent = "Solo « "+(r.name || "?")+" » : "+(r.online === false ? "hors ligne" : "en ligne")+(r.battery != null ? " · batterie "+r.battery+" %" : "")+(r.connection ? " · "+r.connection : "")+(r.state ? " · état "+r.state : "")+".";
    } catch(e){ msg.textContent = apiMessage(e); }
  }
  async function soloPair(){
    var msg = $("soloMsg"); cfg.token = ($("cfgTok").value || "").trim(); saveCfg();
    var code = ($("cfgPair").value || "").trim();
    msg.textContent = "Appairage en cours…";
    try {
      await api("pair", {pairing_code:code, name:$("cfgDev").value.trim() || cfg.device});
      msg.textContent = "Demande envoyée. Regardez l'écran du Solo, puis touchez « Tester la connexion ».";
    } catch(e){ msg.textContent = apiMessage(e); }
  }
  function viewCash(){
    var t = totalCents();
    var given = pay.given, diff = given - t;
    var figs = '<div class="fig"><span>À payer</span><b>'+fmt(t)+'</b></div>'+
               '<div class="fig"><span>Reçu</span><b>'+fmt(given)+'</b></div>'+
               (diff>=0 ? '<div class="fig change"><span>À rendre</span><b>'+fmt(diff)+'</b></div>'
                        : '<div class="fig missing"><span>Il manque</span><b>'+fmt(-diff)+'</b></div>');
    var keys = [1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-key="'+n+'">'+n+'</button>';}).join("")+
               '<button data-key="C" aria-label="Effacer">Effacer</button><button data-key="0">0</button><button data-key="00">00</button>';
    openSheet(
      '<h2>Paiement en espèces</h2><p class="sub">Saisissez la somme reçue du client.</p>'+
      '<div class="cash"><div class="figures">'+figs+
        '<div class="quick"><button data-exact>Exact</button><button data-bill="500">5 €</button><button data-bill="1000">10 €</button>'+
        '<button data-bill="2000">20 €</button><button data-bill="5000">50 €</button><button data-bill="10000">100 €</button></div></div>'+
      '<div class="keys">'+keys+'</div></div>'+
      '<div class="row" style="margin-top:20px"><button class="ghost" data-back>Changer de moyen</button><span class="grow"></span>'+
      '<button class="pay" style="width:auto;padding:0 32px;min-height:64px;font-size:22px" data-validate '+(diff<0?'disabled':'')+'>Valider</button></div>'
    );
  }
  function finish(method, paid, change, ref){
    clearTimeout(timer);
    var no = orderNo; recordOrder(no, method, paid, change, ref);
    var t = totalCents();
    cart = {};
    orderNo++;
    try { localStorage.setItem("caisse-order-no", String(orderNo)); } catch(e){}
    renderCart();
    openSheet(
      '<div class="center"><div class="check" aria-hidden="true">✓</div>'+
      '<h2>Paiement accepté</h2><p class="sub">Commande n° '+no+' · '+method+(ref?' · Réf. '+esc(String(ref).slice(0,13)):'')+'</p>'+
      '<div class="done-amount">'+fmt(t)+'</div>'+
      (change>0 ? '<div class="big-change">Rendre au client<b>'+fmt(change)+'</b></div>' : '')+
      '<button class="primary" data-new>Nouvelle commande</button></div>'
    );
  }

  /* ---------- Événements ---------- */
  document.addEventListener("click", function(e){
    var el = e.target.closest("button"); if(!el) return;
    var ds = el.dataset;
    if(ds.cat){ currentCat = ds.cat; renderTabs(); renderGrid(); return; }
    if(ds.add){ add(ds.add,1); return; }
    if(ds.inc){ add(ds.inc,1); return; }
    if(ds.dec){ add(ds.dec,-1); return; }
    if(el.id==="btnClear"){ cart={}; renderCart(); return; }
    if(el.id==="btnPay"){ if(itemCount()) viewMethods(); return; }
    if(ds.close!==undefined){ closeSheet(); return; }
    if(ds.back!==undefined){ clearTimeout(timer); viewMethods(); return; }
    if(ds.method==="card"){ startSolo(); return; }
    if(ds.method==="cash"){ pay.method="cash"; pay.given=0; viewCash(); return; }
    if(ds.key){
      if(ds.key==="C") pay.given=0;
      else { var next = pay.given*Math.pow(10,ds.key.length)+parseInt(ds.key,10); if(next<10000000) pay.given=next; }
      viewCash(); return;
    }
    if(ds.exact!==undefined){ pay.given=totalCents(); viewCash(); return; }
    if(ds.bill){ pay.given=parseInt(ds.bill,10); viewCash(); return; }
    if(ds.validate!==undefined){
      var t = totalCents();
      if(pay.given>=t) finish("Espèces", pay.given, pay.given-t);
      return;
    }
    if(ds.new!==undefined){ closeSheet(); return; }
    if(ds.solocancel!==undefined){ soloCancel(); return; }
    if(ds.solomanual!==undefined){ soloManual(); return; }
    if(ds.soloback!==undefined){ solo.confirming = false; var p0 = readSolo(); if(p0) soloHint(p0); return; }
    if(ds.solomanualok!==undefined){ soloManualOk(); return; }
    if(ds.soloabandon!==undefined){ soloAbandon(); return; }
    if(ds.soloretry!==undefined){ startSolo(); return; }
    if(ds.solotest!==undefined){ soloTest(); return; }
    if(ds.solopair!==undefined){ soloPair(); return; }
    if(ds.pin!==undefined){ pinKey(ds.pin); return; }
    if(ds.export){ exportCsv(ds.export==="det"); return; }
    if(ds.newpin!==undefined){ adm.mode="create"; adm.buf=""; adm.first=""; adm.err=""; viewPin(); return; }
    if(ds.wipeask!==undefined){ viewWipe(); return; }
    if(ds.adminback!==undefined){ viewAdmin(); return; }
    if(ds.refresh!==undefined){ showAdmin(); return; }
    if(ds.pointage!==undefined){ viewPointage(dayKey(Date.now())); return; }
    if(ds.tick){ ptTick(ds.tick, el); return; }
    if(ds.ptsave!==undefined){ ptSave(); return; }
    if(ds.catOpen!==undefined){ openCatalogue(); return; }
    if(ds.ce!==undefined){ catClick(ds.ce, el); return; }
    if(ds.wipe!==undefined){ wipeAll(); return; }
    if(ds.save!==undefined){
      cfg.device = $("cfgDev").value.trim() || "Caisse 1"; cfg.token = $("cfgTok").value.trim();
      saveCfg(); closeSheet(); toast("Réglages enregistrés"); refreshSolo(); return;
    }
  });

  $("btnFs").addEventListener("click", function(){
    try{
      if(document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }catch(e){ toast("Plein écran indisponible ici"); }
  });
  $("btnTheme").addEventListener("click", function(){
    var r = document.documentElement;
    var dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  });
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},2200); }

  /* ---------- Historique des commandes & administration ---------- */
  var ORD_KEY = "caisse-orders", PIN_KEY = "caisse-admin-pin";
  var adm = null;           // session admin : {mode, buf, first, err}
  function readOrders(){
    try {
      var a = JSON.parse(localStorage.getItem(ORD_KEY)||"[]"); if(!Array.isArray(a)) return [];
      a.forEach(function(o){ if(!o.id) o.id = "l"+Number(o.ts).toString(36)+"-"+o.n; o.synced = o.synced === true; });
      return a;
    } catch(e){ return []; }
  }
  function writeOrders(a){ try { localStorage.setItem(ORD_KEY, JSON.stringify(a)); return true; } catch(e){ return false; } }
  function newOrderId(){ return "o"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7); }
  function recordOrder(no, method, paid, change, ref){
    var items = Object.keys(cart).map(function(id){ var d = byId[id]; return d ? {name:d.name, qty:cart[id], price:d.price} : null; }).filter(Boolean);
    var total = totalCents();
    var a = readOrders();
    a.push({id:newOrderId(), n:no, ts:Date.now(), items:items, total:total, method:method, paid:(paid>0?paid:total), change:change||0, ref:ref||"", device:cfg.device||"Caisse 1", synced:false});

  /* ---------- Base de données partagée (capacité « db » de l'artifact) ---------- */
  var dbP = null, dbState = "unknown", syncing = false;   // dbState : ok | off | denied | full | error
  function getDb(){
    if(!dbP){
      dbP = (window.claude && claude.use) ? claude.use("db").catch(function(){ return null; }) : Promise.resolve(null);
    }
    return dbP.then(function(db){ if(!db) dbP = null; return db; });
  }
  async function syncOrders(){
    if(syncing) return;
    if(!readOrders().some(function(o){ return !o.synced; })) return;
    syncing = true;
    try {
      var db = await getDb();
      if(!db){ dbState = "off"; return; }
      var list = readOrders(), done = {};
      for(var i=0; i<list.length; i++){
        var o = list[i]; if(o.synced) continue;
        try {
          await db.collection("orders").doc(o.id).set({n:o.n, ts:o.ts, items:o.items, total:o.total, method:o.method, paid:o.paid, change:o.change, ref:o.ref, device:o.device||""});
          done[o.id] = true; dbState = "ok";
        } catch(e){
          var c = e && e.code;
          dbState = c==="invalid_argument" ? "denied" : c==="quota_exceeded" ? "full" : "error";
          break;
        }
      }
      var fresh = readOrders();   // relecture : une commande a pu être ajoutée entre-temps
      fresh.forEach(function(o){ if(done[o.id]) o.synced = true; });
      writeOrders(fresh);
    } finally { syncing = false; }
  }
  async function loadAllOrders(){
    await syncOrders();
    var map = {}, remoteOk = false;
    var db = await getDb();
    if(!db){ dbState = "off"; }
    else {
      try {
        var last = 0;
        while(true){
          var snap = await db.collection("orders").where("ts", ">=", last).orderBy("ts", "asc").limit(1000).get();
          var added = 0;
          snap.docs.forEach(function(d){
            if(map[d.id]) return;
            var x = Object.assign({}, d.data()); x.id = d.id; x.synced = true; map[d.id] = x; added++;
            if((x.ts||0) > last) last = x.ts;
          });
          if(snap.size < 1000 || !added) break;
        }
        remoteOk = true;
        if(dbState === "off" || dbState === "unknown") dbState = "ok";
      } catch(e){ dbState = (e && e.code==="invalid_argument") ? "denied" : "error"; }
    }
    readOrders().forEach(function(o){ if(!map[o.id]) map[o.id] = o; });
    var all = Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return a.ts - b.ts; });
    return {orders:all, remoteOk:remoteOk};
  }

  async function sha(s){
    try {
      var b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("caisse:"+s));
      return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,"0"); }).join("");
    } catch(e){ return "p:"+s; }
  }

  async function pinKey(k){
    if(!adm) return;

    if(k!=="OK"){ if(adm.buf.length<8) adm.buf += k; adm.err=""; return viewPin(); }
    if(adm.buf.length<4){ adm.err="Au moins 4 chiffres."; return viewPin(); }
    var h = await sha(adm.buf);
    if(!adm) return;
    if(adm.mode==="enter"){
      var stored = null; try { stored = localStorage.getItem(PIN_KEY); } catch(e){}
      if(h===stored){ adm.buf=""; showAdmin(); }

    } else if(adm.mode==="create"){

        try { localStorage.setItem(PIN_KEY, h); } catch(e){ toast("Code non mémorisé : stockage indisponible"); }
        adm.buf=""; showAdmin(); toast("Code enregistré");

    }

    toast("Catalogue enregistré");
    if(adm) viewAdmin();
  }

  /* ---------- Pointage de caisse ---------- */
  var PT_KEY = "caisse-pointages";
  var TAP = "Carte (SumUp Solo)", CASH = "Espèces";
  function pad2(n){ return (n<10?"0":"")+n; }
  function dayKey(ts){ var d = new Date(ts); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function parseEur(v){ v = String(v==null?"":v).replace(/\s/g,"").replace(",","."); if(!v) return null; var n = Number(v); return isFinite(n) ? Math.round(n*100) : null; }
  function eurIn(c){ return c==null ? "" : (c/100).toFixed(2).replace(".",","); }
  function signed(c){ return (c>0?"+":c<0?"−":"")+fmt(Math.abs(c)); }
  function readPts(){ try { return JSON.parse(localStorage.getItem(PT_KEY)||"{}") || {}; } catch(e){ return {}; } }
  async function loadPointage(date){
    var saved = readPts()[date] || null;
    try {
      var db = await getDb();
      if(db){
        var snap = await db.doc("pointages/"+date).get();
        if(snap.exists){ var r = Object.assign({}, snap.data()); if(!saved || (r.ts||0) >= (saved.ts||0)) saved = r; }
      }
    } catch(e){}
    return saved;
  }
  async function viewPointage(date){
    openSheet('<div class="center"><h2>Pointage de caisse</h2><p class="sub">Chargement…</p></div>');
    var saved = await loadPointage(date);
    if(!adm) return;
    var all = adm.data ? adm.data.orders : readOrders();
    var day = all.filter(function(x){ return dayKey(x.ts) === date; });
    var tap = day.filter(function(x){ return x.method === TAP; });
    var cash = day.filter(function(x){ return x.method === CASH; });
    var other = day.length - tap.length - cash.length;
    var sum = function(a){ return a.reduce(function(s,x){ return s + x.total; }, 0); };
    var ticks = {};
    ((saved && saved.ticks) || []).forEach(function(id){ ticks[id] = true; });
    adm.pt = {date:date, tap:tap, tapTotal:sum(tap), cashTotal:sum(cash), ticks:ticks};
    var rows = tap.map(function(x){
      var d = new Date(x.ts), on = !!ticks[x.id];
      return '<button class="trow'+(on?' on':'')+'" data-tick="'+esc(x.id)+'" aria-pressed="'+on+'"><span class="box">'+(on?'✓':'')+'</span>'+
        '<span>n° '+x.n+' · '+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})+(x.ref?' · réf. '+esc(x.ref):'')+(x.device?' · '+esc(x.device):'')+'</span><b>'+fmt(x.total)+'</b></button>';
    }).join("");
    openSheet(
      `<h2>Pointage de caisse</h2><p class="sub">Comparez les ventes de la caisse avec le relevé SumUp et les espèces comptées.</p>`+
      `<label class="field"><span>Journée</span><input id="ptDate" type="date" value="${esc(date)}"></label>`+
      `<div class="cash" style="margin-top:16px">`+
        `<div class="figures ptcol"><h3>Carte (SumUp Solo)</h3>`+
          `<div class="fig"><span>Ventes en caisse (${tap.length})</span><b>${fmt(adm.pt.tapTotal)}</b></div>`+
          `<label class="field" style="margin:10px 0"><span>Montant SumUp du jour (brut)</span><input id="ptAsso" inputmode="decimal" autocomplete="off" placeholder="ex. 124,50" value="${esc(eurIn(saved && saved.asso))}"></label>`+
          `<div class="fig" id="ptCardGap"></div><div class="fig" id="ptTicked"></div>`+
        `</div>`+
        `<div class="figures ptcol"><h3>Espèces</h3>`+
          `<div class="fig"><span>Ventes en caisse (${cash.length})</span><b>${fmt(sum(cash))}</b></div>`+
          `<label class="field" style="margin:10px 0 0"><span>Fond de caisse au départ</span><input id="ptFond" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(eurIn(saved && saved.fond))}"></label>`+
          `<label class="field" style="margin:10px 0"><span>Espèces comptées dans le tiroir</span><input id="ptCount" inputmode="decimal" autocomplete="off" placeholder="ex. 180,00" value="${esc(eurIn(saved && saved.counted))}"></label>`+
          `<div class="fig" id="ptCashExp"></div><div class="fig" id="ptCashGap"></div>`+
        `</div>`+
      `</div>`+
      `<p class="hint" style="margin-top:12px">Écart carte positif : SumUp a encaissé plus que la caisse. Négatif : la caisse a enregistré plus que SumUp (par exemple une validation à la main sans paiement réel). Saisissez le total du jour affiché dans l'application ou le tableau de bord SumUp.</p>`+
      (rows ? `<p class="detail" style="margin:0 0 6px">Touchez chaque paiement retrouvé dans SumUp pour repérer ceux qui manquent.</p><div class="olist">${rows}</div>` : `<p class="detail">Aucun paiement par carte (SumUp Solo) ce jour-là.</p>`)+
      (other ? `<p class="detail">${other} autre(s) paiement(s) (ancien mode ou démo) ne sont pas comptés ici.</p>` : "")+
      `<label class="field" style="margin:12px 0 0"><span>Remarque</span><input id="ptNote" autocomplete="off" value="${esc(saved && saved.note)}"></label>`+
      (saved ? `<p class="detail">Dernier enregistrement : ${new Date(saved.ts).toLocaleString("fr-FR")}${saved.device?' · '+esc(saved.device):''}</p>` : "")+
      `<div class="row" style="margin-top:16px"><button class="ghost" data-adminback>Retour</button><span class="grow"></span>`+
      `<button class="pay" style="width:auto;padding:0 32px;min-height:64px;font-size:22px" data-ptsave>Enregistrer le pointage</button></div>`
    );
    ["ptAsso","ptFond","ptCount"].forEach(function(id){ $(id).addEventListener("input", ptRecompute); });
    $("ptDate").addEventListener("change", function(){ if(this.value) viewPointage(this.value); });
    ptRecompute();
  }
  function ptRecompute(){
    var p = adm && adm.pt; if(!p || !$("ptAsso")) return;
    var asso = parseEur($("ptAsso").value), g = $("ptCardGap");
    if(asso == null){ g.className = "fig"; g.innerHTML = '<span>Écart carte</span><b>—</b>'; }
    else { var d = asso - p.tapTotal; g.className = "fig "+(d===0?"gap-ok":"gap-bad"); g.innerHTML = '<span>Écart carte</span><b>'+(d===0?"✓ "+fmt(0):signed(d))+'</b>'; }
    var tt = 0, tn = 0;
    p.tap.forEach(function(x){ if(p.ticks[x.id]){ tt += x.total; tn++; } });
    $("ptTicked").innerHTML = '<span>Pointés ('+tn+'/'+p.tap.length+')</span><b>'+fmt(tt)+'</b>';
    var fond = parseEur($("ptFond").value) || 0, cnt = parseEur($("ptCount").value), exp = fond + p.cashTotal;
    $("ptCashExp").innerHTML = '<span>Attendu dans le tiroir</span><b>'+fmt(exp)+'</b>';
    var cg = $("ptCashGap");
    if(cnt == null){ cg.className = "fig"; cg.innerHTML = '<span>Écart espèces</span><b>—</b>'; }
    else { var e2 = cnt - exp; cg.className = "fig "+(e2===0?"gap-ok":"gap-bad"); cg.innerHTML = '<span>Écart espèces</span><b>'+(e2===0?"✓ "+fmt(0):signed(e2))+'</b>'; }
  }
  function ptTick(id, el){
    var p = adm && adm.pt; if(!p) return;
    var on = !p.ticks[id]; if(on) p.ticks[id] = true; else delete p.ticks[id];
    el.classList.toggle("on", on); el.setAttribute("aria-pressed", String(on));
    el.querySelector(".box").textContent = on ? "✓" : "";
    ptRecompute();
  }
  async function ptSave(){
    var p = adm && adm.pt; if(!p) return;
    var rec = {
      date:p.date, tapTotal:p.tapTotal, tapCount:p.tap.length, cashTotal:p.cashTotal,
      asso:parseEur($("ptAsso").value), fond:parseEur($("ptFond").value) || 0, counted:parseEur($("ptCount").value),
      note:$("ptNote").value.trim(), ticks:Object.keys(p.ticks), device:cfg.device, ts:Date.now()
    };
    rec.gapCard = rec.asso == null ? null : rec.asso - rec.tapTotal;
    rec.gapCash = rec.counted == null ? null : rec.counted - (rec.fond + rec.cashTotal);
    var all = readPts(); all[p.date] = rec;
    try { localStorage.setItem(PT_KEY, JSON.stringify(all)); } catch(e){}
    var ok = false;
    try { var db = await getDb(); if(db){ await db.doc("pointages/"+p.date).set(rec); ok = true; } } catch(e){}
    toast(ok ? "Pointage enregistré" : "Pointage enregistré sur cette tablette seulement");
  }
  function csvCell(v){ var s = String(v==null?"":v); return /[";\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
  function eur(c){ return (c/100).toFixed(2).replace(".",","); }
  function buildCsv(o, detail){
    var rows = [];
    function dt(ts){ var d = new Date(ts); return [d.toLocaleDateString("fr-FR"), d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})]; }
    if(!detail){
      rows.push(["N° commande","Date","Heure","Articles","Nb articles","Total (€)","Paiement","Caisse","Reçu (€)","Rendu (€)","Réf. paiement"]);
      o.forEach(function(x){
        var d = dt(x.ts);
        rows.push([x.n, d[0], d[1], x.items.map(function(i){ return i.qty+" × "+i.name; }).join(", "),
          x.items.reduce(function(s,i){ return s+i.qty; }, 0), eur(x.total), x.method, x.device||"", eur(x.paid), eur(x.change), x.ref]);
      });
    } else {
      rows.push(["N° commande","Date","Heure","Boisson","Quantité","Prix unitaire (€)","Total ligne (€)","Paiement","Caisse"]);
      o.forEach(function(x){
        var d = dt(x.ts);
        x.items.forEach(function(i){ rows.push([x.n, d[0], d[1], i.name, i.qty, eur(i.price), eur(i.price*i.qty), x.method, x.device||""]); });
      });
    }
    return "\ufeff" + rows.map(function(r){ return r.map(csvCell).join(";"); }).join("\r\n");
  }
  async function exportCsv(detail){
    var o = (adm && adm.data) ? adm.data.orders : readOrders();
    if(!o.length){ toast("Aucune commande à exporter"); return; }
    var name = "commandes-"+new Date().toISOString().slice(0,10)+(detail?"-detail":"")+".csv";
    var csv = buildCsv(o, detail);
    var dl = null;
    try { dl = (window.claude && claude.use) ? await claude.use("downloads") : null; } catch(e){}
    if(dl){
      try { await dl.save({filename:name, data:csv}); toast("Export enregistré"); }
      catch(err){ if(!err || err.code !== "declined") toast("Export impossible ("+((err && err.code)||"erreur")+")"); }
      return;
    }
    // Repli quand la caisse est hébergée sur votre propre site
    try {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      toast("Export lancé : vérifiez vos téléchargements");
    } catch(e){ toast("Export indisponible dans cette vue"); }
  }
  $("btnAdmin").addEventListener("click", openAdmin);
  setTimeout(syncOrders, 1500);
  setInterval(function(){ syncOrders(); subscribeCatalogue(); }, 60000);

  $("btnSettings").addEventListener("click", viewSettings);

  loadCatalogueLocal();
  renderTabs(); renderCart();
  subscribeCatalogue();
  resumeSolo();
  setTimeout(refreshSolo, 1000);
  setInterval(refreshSolo, 60000);
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
})();
</script>
</body>
</html>
